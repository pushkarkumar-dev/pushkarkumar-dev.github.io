<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ECEEEF" />
  <meta name="color-scheme" content="light" />

  <title>Writing, Pushkar Kumar</title>
  <meta name="description" content="Notes on distributed systems, AI infrastructure and engineering from Pushkar Kumar, senior software engineer at ByteDance." />
  <meta property="og:title" content="Writing, Pushkar Kumar" />
  <meta property="og:description" content="Notes on distributed systems, AI infrastructure and engineering." />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='10' fill='%23FFC628'/%3E%3Ctext x='50' y='70' font-family='Arial,sans-serif' font-size='62' font-weight='800' text-anchor='middle' fill='%2315202B'%3EP%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet" />

  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>

  <style>
    /* ============================================================
       TOKENS (shared with index.html)
    ============================================================ */
    :root {
      --paper:       #ECEEEF;
      --ink:         #15202B;
      --ink-2:       #4A5560;
      --rule:        #C5CBD0;
      --rule-strong: #7D8994;
      --signal:      #FFC628;
      --signal-deep: #F2B300;

      --font: 'Archivo', system-ui, sans-serif;

      --t-base: 1.125rem;
      --t-md:  1.5rem;
      --t-lg:  2rem;
      --t-xl:  2.625rem;

      --wrap: 1120px;
      --gutter: 24px;
      --nav-h: 64px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    html.lenis, html.lenis body { height: auto; }
    .lenis.lenis-smooth { scroll-behavior: auto !important; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font);
      font-size: var(--t-base);
      line-height: 1.55;
      font-variation-settings: 'wdth' 100;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    h1, h2, h3, h4, p { margin: 0; }
    a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 0.2em; }
    a:hover { text-decoration-thickness: 2px; }
    :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 2px; }
    ::selection { background: var(--signal); color: var(--ink); }

    .wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 var(--gutter); }

    /* ============================================================
       NAV (same as index.html)
    ============================================================ */
    .nav {
      position: sticky; top: 0; z-index: 50;
      background: var(--paper);
      border-bottom: 1px solid transparent;
      transition: border-color .2s;
    }
    .nav.scrolled { border-bottom-color: var(--rule); }
    .nav-inner { display: flex; align-items: center; justify-content: space-between; height: var(--nav-h); }

    .brand {
      font-weight: 800; font-variation-settings: 'wdth' 125;
      font-size: 1.0625rem; text-decoration: none; letter-spacing: -0.01em;
    }

    .nav-links { display: flex; align-items: center; gap: 28px; font-size: 0.9375rem; }
    .nav-links a, .nav-dropdown__trigger { text-decoration: none; color: var(--ink-2); }
    .nav-links a:hover, .nav-dropdown__trigger:hover { color: var(--ink); text-decoration: underline; }
    .nav-links a[aria-current="page"] { color: var(--ink); font-weight: 700; }

    .nav-dropdown { position: relative; }
    .nav-dropdown__trigger {
      font: inherit; background: none; border: 0; padding: 0; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .nav-dropdown__trigger svg { transition: transform .2s; }
    .nav-dropdown.open .nav-dropdown__trigger svg { transform: rotate(180deg); }
    .nav-dropdown__menu {
      position: absolute; right: 0; top: calc(100% + 14px);
      min-width: 220px; padding: 8px 0;
      background: #F7F8F8; border: 1px solid var(--ink);
      display: none;
    }
    .nav-dropdown.open .nav-dropdown__menu { display: block; }
    .nav-dropdown__menu a { display: block; padding: 8px 16px; color: var(--ink); }
    .nav-dropdown__menu a:hover { background: var(--signal); text-decoration: none; }

    .nav-toggle {
      display: none; font: inherit; font-size: 0.9375rem; color: var(--ink);
      background: none; border: 1px solid var(--ink); padding: 6px 12px; cursor: pointer;
    }

    @media (max-width: 760px) {
      .nav-toggle { display: block; }
      .nav-links {
        display: none;
        position: absolute; left: 0; right: 0; top: var(--nav-h);
        flex-direction: column; align-items: stretch; gap: 0;
        background: var(--paper); border-bottom: 1px solid var(--ink);
        padding: 8px var(--gutter) 16px;
      }
      .nav-links.open { display: flex; }
      .nav-links > a, .nav-dropdown__trigger { padding: 10px 0; color: var(--ink); font-size: 1.0625rem; }
      .nav-dropdown__trigger { display: none; }
      .nav-dropdown__menu {
        display: block; position: static; border: 0; background: none; padding: 0;
      }
      .nav-dropdown__menu a { padding: 10px 0; font-size: 1.0625rem; }
    }

    /* ============================================================
       HERO
    ============================================================ */
    .hero { padding: 56px 0 72px; }
    h1 {
      font-size: clamp(2.75rem, 7.2vw, 5.75rem);
      font-weight: 800; font-variation-settings: 'wdth' 125;
      line-height: 0.95; letter-spacing: -0.025em;
    }
    .hero-sub { margin-top: 24px; max-width: 34em; font-size: var(--t-md); line-height: 1.4; }
    .hero-count { margin-top: 12px; color: var(--ink-2); }

    /* ============================================================
       POSTS
    ============================================================ */
    .posts-block { padding: 56px 0 72px; border-top: 1.5px solid var(--ink); }
    .section-title {
      font-size: var(--t-xl); font-weight: 800; font-variation-settings: 'wdth' 125;
      line-height: 1.05; letter-spacing: -0.02em;
      margin-bottom: 40px;
    }

    .post {
      display: grid; grid-template-columns: 240px 1fr; gap: 48px;
      padding: 28px 0; border-top: 1px solid var(--rule);
      text-decoration: none;
    }
    .post:first-of-type { border-top: 0; padding-top: 0; }
    .post-meta { color: var(--ink-2); font-size: 0.9375rem; line-height: 1.5; }
    .post-meta strong { display: block; color: var(--ink); font-weight: 700; font-size: var(--t-base); }

    .post-title {
      font-size: var(--t-md); font-weight: 700; font-variation-settings: 'wdth' 106;
      line-height: 1.25; max-width: 28em;
    }
    .post-desc { margin-top: 10px; max-width: 38em; }
    .post:hover .post-title { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 0.18em; }

    .post--featured .post-title {
      font-size: var(--t-lg); font-variation-settings: 'wdth' 112; font-weight: 800;
      letter-spacing: -0.01em; line-height: 1.15;
    }
    .post--featured .post-desc { font-size: 1.1875rem; }
    .post-cta {
      display: inline-block; margin-top: 20px; font-weight: 700;
      background: linear-gradient(var(--signal), var(--signal)) no-repeat left bottom / 100% 0.3em;
      transition: background-size .2s;
    }
    .post:hover .post-cta { background-size: 100% 100%; }

    .empty { color: var(--ink-2); padding: 40px 0; }

    @media (max-width: 800px) {
      .post { grid-template-columns: 1fr; gap: 8px; }
      .posts-block { padding: 48px 0 56px; }
      .section-title { font-size: var(--t-lg); margin-bottom: 28px; }
    }

    /* ============================================================
       FOOTER
    ============================================================ */
    footer { border-top: 1.5px solid var(--ink); padding: 28px 0 40px; font-size: 0.9375rem; color: var(--ink-2); }
    .footer-inner { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; }
  </style>
</head>
<body>

  <header class="nav" id="nav">
    <div class="wrap nav-inner">
      <a href="index.html" class="brand">Pushkar Kumar</a>
      <button class="nav-toggle" id="navToggle" aria-controls="navLinks" aria-expanded="false">Menu</button>
      <nav class="nav-links" id="navLinks" aria-label="Primary">
        <a href="index.html#work">Work</a>
        <a href="index.html#lab">Lab</a>
        <a href="index.html#teaching">Teaching</a>
        <a href="index.html#experience">Experience</a>
        <a href="blog.html" aria-current="page">Writing</a>
        <div class="nav-dropdown" id="learnDropdown">
          <button class="nav-dropdown__trigger" aria-haspopup="true" aria-expanded="false">
            Learn
            <svg width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
          </button>
          <div class="nav-dropdown__menu" role="menu">
            <a href="dsa.html" role="menuitem">DSA revision</a>
            <a href="system-design/" role="menuitem">System design</a>
            <a href="https://pushkarkumar-dev.github.io/system-design-labs/" target="_blank" rel="noopener" role="menuitem">Build labs</a>
            <a href="https://pushkarkumar-dev.github.io/ComputerConceptVisualization/" target="_blank" rel="noopener" role="menuitem">Concept visualizations</a>
          </div>
        </div>
        <a href="index.html#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="wrap">
        <h1>Writing</h1>
        <p class="hero-sub">
          Notes on distributed systems, AI infrastructure and engineering, from 9+ years building at scale.
        </p>
        <p class="hero-count" id="heroCount"></p>
      </div>
    </section>

    <div id="postsContainer"></div>
  </main>

  <footer>
    <div class="wrap footer-inner">
      <span>© <span id="year"></span> Pushkar Kumar. <a href="index.html">Back to the home page</a></span>
      <a href="#top">Back to top</a>
    </div>
  </footer>

  <script>
    /* ════════════════════════════════════════════════════════════════
       BLOG POSTS — add new entries here, newest first.

       Fields:
         title       — card heading
         slug        — HTML filename  e.g. "my-post.html"
         description — 1–2 sentence summary shown on the card
         date        — display string  e.g. "May 2026"
         category    — tag label
         readTime    — estimated read time  e.g. "8 min read"
    ════════════════════════════════════════════════════════════════ */
    const POSTS = [
      {
        title:       'Claude Code · Developer Command Reference',
        slug:        'blog/claude-code-guide.html',
        description: 'Complete command reference for Claude Code CLI — installation, auth, sessions, slash commands, MCP servers, subagents, hooks, and more. Beginner to advanced.',
        date:        'May 2026',
        category:    'Developer Tools',
        readTime:    '10 min read',
      },
      {
        title:       'System Design Interview Prep — 60 Deep-Dives',
        slug:        'system-design/',
        description: 'Staff-level system design questions with capacity math, tradeoff tables, Mermaid diagrams, and curveball scenarios. Covers distributed systems, databases, streaming, and more.',
        date:        'May 2026',
        category:    'System Design',
        readTime:    '60 questions',
      },
      {
        title:       'DSA Patterns — Curated Problem Sets',
        slug:        'dsa.html',
        description: 'Hand-picked LeetCode and competitive programming problems organized by pattern — sliding window, trees, graphs, DP, and more. Built for structured interview prep.',
        date:        'May 2026',
        category:    'DSA',
        readTime:    'Problem sets',
      },
      {
        title:       'Concept Viz — Engineering Knowledge Base',
        slug:        'https://pushkarkumar-dev.github.io/ComputerConceptVisualization/',
        description: '63 curated cards across distributed systems, storage, networking, ML systems and more — each with an interview-focused summary and key concepts. Includes an interactive Raft consensus visualization.',
        date:        'May 2026',
        category:    'Visualizations',
        readTime:    '63 cards',
      },
      {
        title:       'build.labs — System Design Labs',
        slug:        'https://pushkarkumar-dev.github.io/system-design-labs/',
        description: '61 hands-on labs where you build real systems from scratch — write-ahead logs, Raft consensus, epoll servers, LLM inference, and more. Each lab ships working code in Rust, Go, Python, or C with real benchmarks.',
        date:        'May 2026',
        category:    'Labs',
        readTime:    '61 labs',
      },
      // ↑ Add new posts above this line
    ];

    /* ── RENDER ──────────────────────────────────────────────────── */

    function postMeta(p) {
      return `
        <div class="post-meta">
          <strong>${p.category}</strong>
          ${p.date}<br />
          ${p.readTime}
        </div>`;
    }

    function render() {
      const container = document.getElementById('postsContainer');
      const countEl   = document.getElementById('heroCount');

      countEl.textContent = `${POSTS.length} post${POSTS.length !== 1 ? 's' : ''} published`;

      if (!POSTS.length) {
        container.innerHTML = `
          <section class="posts-block"><div class="wrap">
            <p class="empty">No posts yet. Check back soon.</p>
          </div></section>`;
        return;
      }

      const [first, ...rest] = POSTS;

      /* Featured */
      const featured = `
        <section class="posts-block" aria-labelledby="latestTitle">
          <div class="wrap">
            <h2 class="section-title" id="latestTitle">Latest post</h2>
            <a href="${first.slug}" class="post post--featured">
              ${postMeta(first)}
              <div>
                <h3 class="post-title">${first.title}</h3>
                <p class="post-desc">${first.description}</p>
                <span class="post-cta">Read the guide</span>
              </div>
            </a>
          </div>
        </section>`;

      /* Remaining posts */
      let list = '';
      if (rest.length) {
        const rows = rest.map(p => `
          <a href="${p.slug}" class="post">
            ${postMeta(p)}
            <div>
              <h3 class="post-title">${p.title}</h3>
              <p class="post-desc">${p.description}</p>
            </div>
          </a>`).join('');

        list = `
          <section class="posts-block" aria-labelledby="allTitle">
            <div class="wrap">
              <h2 class="section-title" id="allTitle">All posts</h2>
              ${rows}
            </div>
          </section>`;
      }

      container.innerHTML = featured + list;
    }

    render();
    document.getElementById('year').textContent = new Date().getFullYear();

    /* ── NAV ─────────────────────────────────────────────────────── */

    const nav       = document.getElementById('nav');
    const navToggle = document.getElementById('navToggle');
    const navLinks  = document.getElementById('navLinks');
    const reduced   = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    navToggle.addEventListener('click', () => {
      const open = navLinks.classList.toggle('open');
      navToggle.setAttribute('aria-expanded', String(open));
      navToggle.textContent = open ? 'Close' : 'Menu';
    });

    const learnDropdown = document.getElementById('learnDropdown');
    if (learnDropdown) {
      const trigger = learnDropdown.querySelector('.nav-dropdown__trigger');
      const setOpen = (open) => {
        learnDropdown.classList.toggle('open', open);
        trigger.setAttribute('aria-expanded', String(open));
      };
      trigger.addEventListener('click', (e) => { e.stopPropagation(); setOpen(!learnDropdown.classList.contains('open')); });
      document.addEventListener('click', () => setOpen(false));
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setOpen(false); });
    }

    /* ── SCROLLING ───────────────────────────────────────────────── */

    const setScrolled = (y) => nav.classList.toggle('scrolled', y > 8);
    let lenis = null;
    if (!reduced) {
      lenis = new Lenis({ lerp: 0.1, smoothWheel: true });
      (function raf(t) { lenis.raf(t); requestAnimationFrame(raf); })(performance.now());
      lenis.on('scroll', ({ scroll }) => setScrolled(scroll));
    } else {
      window.addEventListener('scroll', () => setScrolled(window.scrollY), { passive: true });
    }
    setScrolled(window.scrollY);

    document.querySelectorAll('a[href="#top"]').forEach((a) => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        if (lenis) lenis.scrollTo(0, { duration: 1.2 });
        else window.scrollTo({ top: 0 });
      });
    });
  </script>
</body>
</html>
