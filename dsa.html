  <header class="nav" id="nav">
    <div class="wrap nav-inner">

      <nav class="nav-links" id="navLinks" aria-label="Primary">

        <a href="index.html#lab">Lab</a>

        <div class="nav-dropdown" id="learnDropdown">
          <button class="nav-dropdown__trigger" aria-haspopup="true" aria-expanded="false">
            Learn
            <svg width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
          </button>
          <div class="nav-dropdown__menu" role="menu">
            <a href="dsa.html" role="menuitem" aria-current="page">DSA revision</a>
            <a href="system-design/" role="menuitem">System design</a>

      </nav>

  <div class="dsa-app">
    <div class="dsa-inner">

      <!-- ── Header ──────────────────────────────────────────── -->
      <header class="dsa-header">

        <div class="dsa-header-top">
          <div>
            <h1 class="dsa-title">DSA revision</h1>
            <p class="dsa-tagline">About 150 interview problems grouped by pattern, for last-minute recall. Open a problem for the idea, the approach, a code skeleton and common pitfalls.</p>
          </div>

          <div class="dsa-search-wrap">
            <input
              id="dsa-search"
              class="dsa-search"
              type="search"
              placeholder="Search by name, pattern, or LC#"
              autocomplete="off"
              spellcheck="false"
              aria-label="Search problems"
            />
            <kbd class="dsa-search-kbd" aria-hidden="true">/</kbd>
          </div>
        </div>

        <!-- Pattern filter chips -->
        <div id="dsa-chips" class="dsa-chips" role="group" aria-label="Filter by pattern"></div>

      </header>

      <!-- ── Toolbar ─────────────────────────────────────────── -->
      <div class="dsa-toolbar" role="toolbar" aria-label="Card controls">
        <span class="dsa-count" id="dsa-count" aria-live="polite"></span>
        <div class="dsa-toolbar-btns">
          <button class="dsa-btn" id="dsa-expand-all">Expand all</button>
          <button class="dsa-btn" id="dsa-collapse-all">Collapse all</button>
        </div>
      </div>

      <!-- ── Cards ───────────────────────────────────────────── -->
      <main id="dsa-cards" class="dsa-cards" aria-label="Problem cards"></main>

    </div>
  </div>

  <!-- Problem data — one file per pattern -->
  <script src="dsa-assets/data/problems-sliding-window.js"></script>

  <script src="dsa-assets/data/problems-trees.js"></script>
  <script src="dsa-assets/data/problems-tries.js"></script>
  <script src="dsa-assets/data/problems-heap.js"></script>
  <script src="dsa-assets/data/problems-backtracking.js"></script>
  <script src="dsa-assets/data/problems-graphs.js"></script>
  <script src="dsa-assets/data/problems-advanced-graphs.js"></script>
  <script src="dsa-assets/data/problems-1d-dp.js"></script>
  <script src="dsa-assets/data/problems-2d-dp.js"></script>
  <script src="dsa-assets/data/problems-intervals.js"></script>
  <script src="dsa-assets/data/problems-greedy.js"></script>
  <script src="dsa-assets/data/problems-math-geometry.js"></script>

  <script src="dsa-assets/src/animations.js"></script>
  <script src="dsa-assets/src/main.js"></script>
  <script>
    (function () {
      var nav = document.getElementById('nav');
      var navToggle = document.getElementById('navToggle');
      var navLinks = document.getElementById('navLinks');
      navToggle.addEventListener('click', function () {
        var open = navLinks.classList.toggle('open');
        navToggle.setAttribute('aria-expanded', String(open));
        navToggle.textContent = open ? 'Close' : 'Menu';
      });

      var dd = document.getElementById('learnDropdown');
      var trigger = dd.querySelector('.nav-dropdown__trigger');
      var setOpen = function (open) {
        dd.classList.toggle('open', open);
        trigger.setAttribute('aria-expanded', String(open));
      };
      trigger.addEventListener('click', function (e) { e.stopPropagation(); setOpen(!dd.classList.contains('open')); });
      document.addEventListener('click', function () { setOpen(false); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });

      var onScroll = function () { nav.classList.toggle('scrolled', window.scrollY > 8); };
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
    })();
  </script>
</body>
</html>
