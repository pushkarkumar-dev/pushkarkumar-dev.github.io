<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DSA Revision · Pushkar</title>
  <meta name="description" content="Last-minute FAANG DSA revision — 150 problems, warm dark cards. Pattern chips, search, algorithm animations." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..800&family=Manrope:wght@300..700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="dsa-assets/styles.css" />

  <!-- Reset only the outer document — .dsa-app handles its own interior -->
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #0e0b08; }
  </style>
</head>
<body>

  <div class="dsa-app">
    <div class="dsa-inner">

      <!-- ── Header ──────────────────────────────────────────── -->
      <header class="dsa-header">

        <div class="dsa-header-top">
          <div>
            <a href="index.html" class="dsa-back">← pushkar.dev</a>
            <h1 class="dsa-title">DSA&nbsp;<span>Revision</span></h1>
            <p class="dsa-tagline">~150 FAANG problems &middot; last-minute recall &middot; warm dark editorial</p>
          </div>

          <div class="dsa-search-wrap">
            <input
              id="dsa-search"
              class="dsa-search"
              type="search"
              placeholder="Search by name, pattern, or LC#"
              autocomplete="off"
              spellcheck="false"
              aria-label="Search problems"
            />
            <kbd class="dsa-search-kbd" aria-hidden="true">/</kbd>
          </div>
        </div>

        <!-- Pattern filter chips -->
        <div id="dsa-chips" class="dsa-chips" role="group" aria-label="Filter by pattern"></div>

      </header>

      <!-- ── Toolbar ─────────────────────────────────────────── -->
      <div class="dsa-toolbar" role="toolbar" aria-label="Card controls">
        <span class="dsa-count" id="dsa-count" aria-live="polite"></span>
        <div class="dsa-toolbar-btns">
          <button class="dsa-btn" id="dsa-expand-all">Expand all</button>
          <button class="dsa-btn" id="dsa-collapse-all">Collapse all</button>
        </div>
      </div>

      <!-- ── Cards ───────────────────────────────────────────── -->
      <main id="dsa-cards" class="dsa-cards" aria-label="Problem cards"></main>

    </div>
  </div>

  <script src="dsa-assets/data/problems.js"></script>
  <script src="dsa-assets/src/animations.js"></script>
  <script src="dsa-assets/src/main.js"></script>
</body>
</html>
